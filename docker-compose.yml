version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./data:/app/data:ro
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_API_KEY: ${BACKEND_GOOGLE_API_KEY}
      MAPS_API_KEY: ${BACKEND_MAPS_API_KEY}
      BQ_DATASET: ${BACKEND_BQ_DATASET:-edualloc_dataset}
      DISTRICT_CODE: ${BACKEND_DISTRICT_CODE:-NDB01}
      APP_ENV: ${BACKEND_APP_ENV:-development}
      PORT: ${BACKEND_PORT:-8080}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/service-account.json
      FIREBASE_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT}
      CORS_ORIGINS: http://localhost:5173
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8080
      VITE_MAPS_API_KEY: ${FRONTEND_MAPS_API_KEY}
      VITE_FIREBASE_API_KEY: ${FRONTEND_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${FRONTEND_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${FRONTEND_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_APP_ID: ${FRONTEND_FIREBASE_APP_ID}
      VITE_APP_ENV: ${FRONTEND_APP_ENV:-development}
      VITE_DEFAULT_DISTRICT_ID: NDB01
      VITE_DEFAULT_DISTRICT_NAME: Nandurbar
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
